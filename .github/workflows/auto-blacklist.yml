name: auto-blacklist

# 维护者用标签或关闭原因控制流程：
#   resolved / Close as completed   -> 校验 Issue -> 追加 blacklist.json -> 提交到 main
#   wontfix  / Close as not planned -> 不修改黑名单 -> 回复说明
#
# 只有拥有 write / maintain / admin 权限的操作者触发的流程才会被处理。
# 所有解析都在 Node 脚本内完成，Issue 内容不会进入 shell。

on:
  issues:
    types: [labeled, closed]

permissions:
  contents: write
  issues: write

concurrency:
  # 同一个 Issue 的事件串行；不同 Issue 允许并行。
  # 并行写入的冲突由提交步骤的“重置到最新 main 再重放”重试解决。
  group: pkillfish-blacklist-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request == null &&
      (
        (github.event.action == 'labeled' &&
          (github.event.label.name == 'resolved' ||
           github.event.label.name == 'wontfix')) ||
        github.event.action == 'closed'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
      decision: ${{ steps.permission.outputs.decision }}
    steps:
      - name: Verify label actor permission
        id: permission
        uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.sender;
            const action = context.payload.action;
            let decision = '';

            if (action === 'labeled') {
              decision = context.payload.label && context.payload.label.name;
            } else if (action === 'closed') {
              // GitHub UI：Close as completed = 通过，Close as not planned = 不通过。
              decision =
                context.payload.issue.state_reason === 'completed'
                  ? 'resolved'
                  : 'wontfix';
            }

            core.setOutput('decision', decision || '');
            core.setOutput('allowed', 'false');

            if (!sender || !sender.login) {
              core.warning('无法识别触发者，跳过。');
              return;
            }
            if (decision !== 'resolved' && decision !== 'wontfix') {
              core.warning(`未知的触发方式：${action}/${decision}，跳过。`);
              return;
            }

            const labels = (context.payload.issue.labels || []).map((label) =>
              typeof label === 'string' ? label : label.name
            );
            if (!labels.includes('report')) {
              core.warning('Issue 缺少 report 标签，跳过自动处理。');
              return;
            }
            if (sender.type === 'Bot') {
              core.setOutput('allowed', 'true');
              return;
            }
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: sender.login
              });
              const allowed = ['admin', 'maintain', 'write'].includes(data.permission);
              core.setOutput('allowed', String(allowed));
              if (!allowed) {
                core.warning(
                  `触发者 ${sender.login} 的仓库权限为 ${data.permission}，` +
                  '只有 write / maintain / admin 可以触发自动黑名单变更，跳过。'
                );
              }
            } catch (error) {
              core.warning(`校验触发者权限失败：${error.message}，跳过。`);
            }

  resolve:
    needs: authorize
    if: >-
      needs.authorize.outputs.allowed == 'true' &&
      needs.authorize.outputs.decision == 'resolved' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse Issue and update blacklist
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-report.mjs

      - name: Validate blacklist after write
        run: node scripts/validate-blacklist.mjs blacklist.json

      - name: Commit and push to main
        if: steps.apply.outputs.changed == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIDS: ${{ steps.apply.outputs.mids }}
        run: |
          set -euo pipefail
          git config user.name "pkillFish-bot"
          git config user.email "pkillfish-bot@users.noreply.github.com"

          # 不用全局 concurrency 排队（GitHub 只保留一个 pending，会把合法的
          # 其他 Issue 取消）。不同 Issue 并行处理，推送冲突时重置到最新 main
          # 重新解析本 Issue，再重试推送。
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "push 冲突，第 ${attempt} 次重试：同步 main 并重新应用本 Issue"
              git fetch origin main
              git reset --hard origin/main
              node scripts/apply-report.mjs
              node scripts/validate-blacklist.mjs blacklist.json
            fi

            git add blacklist.json docs/blacklist-changelog.md
            if git diff --cached --quiet; then
              echo "没有需要提交的变更"
              exit 0
            fi

            git commit -m "chore(blacklist): update UIDs ${MIDS} (#${ISSUE_NUMBER})"
            if git push origin HEAD:main; then
              echo "push 成功"
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "连续 5 次推送失败，请检查分支保护或网络" >&2
          exit 1

      - name: Comment success
        if: success()
        uses: actions/github-script@v7
        env:
          MIDS: ${{ steps.apply.outputs.mids }}
          COUNT: ${{ steps.apply.outputs.count }}
          CHANGED: ${{ steps.apply.outputs.changed }}
          ADDED: ${{ steps.apply.outputs.added }}
          REPORTED: ${{ steps.apply.outputs.reported }}
          DUPLICATE: ${{ steps.apply.outputs.duplicate }}
        with:
          script: |
            const mids = process.env.MIDS || '';
            const count = process.env.COUNT;
            const changed = process.env.CHANGED === 'true';
            const added = process.env.ADDED || '0';
            const reported = process.env.REPORTED || '0';
            const duplicate = process.env.DUPLICATE || '0';
            const body = [
              '### pkillFish 自动处理完成',
              '',
              `- 处理 UID：\`${mids}\``,
              `- 新增：${added}；补充证据：${reported}；重复：${duplicate}`,
              `- 黑名单当前规模：${count} 条`,
              `- 本次是否写入：${changed ? '是' : '否'}`,
              '',
              changed
                ? '变更已通过校验并提交到 `main`，同时写入 `docs/blacklist-changelog.md`。'
                : '未产生文件变更，因此没有提交。',
              '',
              '本 Issue 由维护者标记 `resolved` 或关闭为 `completed` 触发。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });

      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### pkillFish 自动处理失败',
              '',
              '本次没有写入黑名单。可能原因：',
              '',
              '- Issue 正文缺少 `pkillfish:meta` 或 `pkillfish:batch` 区块，或 UID / 链接 / 原文格式不合法；',
              '- `blacklist.json` 现有内容未通过校验；',
              '- UID 位于 `revoked` 列表，需要人工复核；',
              '- 分支保护拒绝了直接推送。',
              '',
              '请维护者检查 workflow 日志，修正后移除并重新添加 `resolved` 标签，或手工处理。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });

  wontfix:
    needs: authorize
    if: >-
      needs.authorize.outputs.allowed == 'true' &&
      needs.authorize.outputs.decision == 'wontfix' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### 未加入黑名单',
              '',
              '维护者已将本 Issue 标记为 `wontfix`，或关闭为 `not planned`，因此：',
              '',
              '- `blacklist.json` 不会发生任何变更；',
              '- 本 Issue 关闭，流程结束；',
              '- 如果之后补充了新的证据，可以重新打开 Issue，移除 `wontfix` 后由维护者重新审核。',
              '',
              '说明：`wontfix` 表示“本次不处理”，并不等于对评论内容的最终定性。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
